
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MOSS — Seguimiento de tu obra</title>
<meta name="description" content="Sigue el avance de tu proyecto de remodelación con MOSS">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --v:#2D4A35;--vc:#EFF5F1;--bv:#C8DDD0;
  --b:#E8E2D9;--bc:#FAF8F5;--g:#6B6560;
  --cr:#FFFFFF;--ok:#3A6B45;--warn:#C17B2A;--err:#B5362A;
  --camel:#A67C52;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F0EA;color:#1C1A18;min-height:100vh;}
.header{background:var(--v);padding:18px 20px;display:flex;align-items:center;gap:14px;}
.header-logo{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;letter-spacing:-.5px;}
.header-title{color:#fff;}
.header-title h1{font-size:16px;font-weight:700;letter-spacing:-.3px;}
.header-title p{font-size:11px;opacity:.7;margin-top:1px;}
.container{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
.card{background:#fff;border-radius:14px;border:1px solid var(--b);margin-bottom:14px;overflow:hidden;}
.card-header{padding:14px 18px;background:var(--v);color:#fff;}
.card-header h2{font-size:14px;font-weight:700;}
.card-header .sub{font-size:11px;opacity:.75;margin-top:2px;}
.card-body{padding:16px 18px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0;}
.kpi{background:var(--bc);border:1px solid var(--b);border-radius:10px;padding:12px;text-align:center;}
.kpi-val{font-size:22px;font-weight:800;color:var(--v);}
.kpi-lbl{font-size:10px;color:var(--g);margin-top:3px;text-transform:uppercase;letter-spacing:.4px;}
.progress-bar-wrap{background:#EDE8E1;border-radius:99px;height:10px;margin:8px 0 4px;}
.progress-bar-fill{height:10px;border-radius:99px;background:var(--v);transition:width .6s ease;}
.cap-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--b);}
.cap-row:last-child{border-bottom:none;}
.cap-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.cap-nom{font-size:13px;flex:1;}
.cap-estado{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.estado-completo{background:#DDEEE0;color:#2D6A3F;}
.estado-activo{background:#FFF3E0;color:#A06010;}
.estado-pendiente{background:#F0EEEB;color:#9A9490;}
.video-link{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bc);border:1px solid var(--b);border-radius:10px;text-decoration:none;color:inherit;margin-bottom:8px;}
.video-link:last-child{margin-bottom:0;}
.video-icon{width:36px;height:36px;background:var(--v);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0;}
.video-info h4{font-size:12px;font-weight:600;}
.video-info p{font-size:11px;color:var(--g);margin-top:2px;}
.nota-box{background:#FFFBF4;border:1px solid #F0DDB4;border-radius:10px;padding:14px;font-size:13px;line-height:1.6;color:#5A4A30;}
.nota-autor{font-size:11px;color:var(--g);margin-top:8px;}
.loading{text-align:center;padding:60px 20px;}
.loading-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--v);margin:0 3px;animation:ld .9s infinite alternate;}
.loading-dot:nth-child(2){animation-delay:.3s;}
.loading-dot:nth-child(3){animation-delay:.6s;}
@keyframes ld{to{opacity:.2;transform:translateY(-4px);}}
.error-box{text-align:center;padding:60px 20px;}
.error-box .icon{font-size:40px;margin-bottom:12px;}
.error-box h2{font-size:18px;margin-bottom:8px;}
.error-box p{font-size:13px;color:var(--g);}
.badge-etapa{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:#DDEEE0;color:#2D6A3F;}
.footer{text-align:center;font-size:11px;color:var(--g);margin-top:24px;padding-bottom:20px;}
.footer span{color:var(--camel);font-weight:600;}
.semana-sel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.semana-btn{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--b);background:#fff;cursor:pointer;font-family:inherit;color:var(--g);}
.semana-btn.activo{background:var(--v);color:#fff;border-color:var(--v);}
.msg-burbuja{padding:10px 13px;border-radius:12px;margin-bottom:8px;font-size:13px;line-height:1.5;max-width:90%;}
.bal-cuota{border:1px solid var(--b);border-radius:11px;padding:12px 14px;margin-bottom:8px;}
.bal-cuota.pagado{background:#F0FAF2;border-color:#B8DFC0;}
.bal-cuota.vencida{background:#FFF5F5;border-color:#EBBCBC;}
.bal-cuota.pendiente{background:#FFFBF4;border-color:#F0DDB4;}
.bal-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.bal-nom{font-size:13px;font-weight:600;color:var(--v);flex:1;}
.bal-val{font-size:15px;font-weight:800;}
.bal-estado{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-top:6px;}
.bal-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.bal-kpi-item{background:var(--bc);border:1px solid var(--b);border-radius:10px;padding:11px;text-align:center;}
.bal-kpi-val{font-size:16px;font-weight:800;}
.bal-kpi-lbl{font-size:10px;color:var(--g);margin-top:3px;text-transform:uppercase;letter-spacing:.4px;}
.bal-add{border:1px solid #E8C88A;border-radius:11px;padding:11px 13px;margin-bottom:7px;background:#FFFBF4;}
.bal-add.pagado{background:#F0FAF2;border-color:#B8DFC0;}
.msg-cliente{background:#EFF5F1;border:1px solid #C8DDD0;border-radius:12px 12px 12px 4px;align-self:flex-start;}
.msg-moss{background:var(--v);color:#fff;border-radius:12px 12px 4px 12px;align-self:flex-end;margin-left:auto;}
.msg-meta{font-size:10px;opacity:.65;margin-top:3px;}
.msg-wrap{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:320px;overflow-y:auto;padding:2px;}
.msg-input{width:100%;font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--bc);resize:none;line-height:1.5;}
.msg-input:focus{outline:none;border-color:var(--v);}
.msg-send-btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--v);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;}
.msg-send-btn:disabled{opacity:.5;cursor:not-allowed;}
.msg-empty{text-align:center;padding:20px;font-size:12px;color:var(--g);}
/* Bienvenida personalizada */
.bienvenida{background:linear-gradient(135deg,#2D4A35 0%,#3A5C44 100%);border-radius:16px;padding:22px 20px;margin-bottom:16px;color:#fff;position:relative;overflow:hidden;}
.bienvenida::after{content:"";position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.06);border-radius:50%;}
.bienvenida-saludo{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px;}
.bienvenida-proyecto{font-size:13px;opacity:.85;margin-bottom:14px;}
.bienvenida-mensaje{font-size:14px;line-height:1.55;opacity:.95;font-weight:400;position:relative;z-index:1;}
/* Momento especial */
.momento-especial{background:#FFFBF4;border:1px solid #E8C88A;border-left:4px solid #C17B2A;border-radius:12px;padding:16px 18px;margin-bottom:16px;}
.momento-especial-titulo{font-size:11px;font-weight:800;color:#C17B2A;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.momento-especial-texto{font-size:14px;line-height:1.55;color:#5A4A30;font-weight:500;}
/* Mensaje de MOSS dinámico */
.mensaje-moss{background:#F5F0EA;border-radius:12px;padding:16px 18px;margin-bottom:16px;border:1px solid var(--b);}
.mensaje-moss-titulo{font-size:11px;font-weight:800;color:var(--v);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.mensaje-moss-texto{font-size:13px;line-height:1.6;color:#4A5248;font-style:italic;}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">M</div>
  <div class="header-title">
    <h1>MOSS Remodelaciones</h1>
    <p>Portal de seguimiento · Tu obra en tiempo real</p>
  </div>
</div>

<div class="container">
  <div id="root"><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div><p style="margin-top:16px;font-size:13px;color:var(--g);">Cargando información de tu proyecto...</p></div></div>
</div>

<script>
var SCRIPT_URL="https://script.google.com/macros/s/AKfycbyV1vK-Aw0kyAekawzvoB--JSBhl5ksbaNqSxuNorNQtyf00de5z43lSGvhFc0H-6cUKw/exec";

var CAPS=[
  {n:1,nom:"Diseño"},
  {n:2,nom:"Redes eléctricas e hidrosanitarias"},
  {n:3,nom:"Obra blanca"},
  {n:4,nom:"Pisos y enchapes"},
  {n:5,nom:"Carpintería y mobiliario"},
  {n:6,nom:"Pintura y estuco"},
  {n:7,nom:"Sanitarios y griferías"},
  {n:8,nom:"Electrodomésticos"},
  {n:9,nom:"Aseo general"},
  {n:10,nom:"Pre-entrega"},
  {n:11,nom:"Entrega final"}
];

function getParam(k){return new URLSearchParams(window.location.search).get(k)||"";}
function ff(f){if(!f)return"Por definir";try{return new Date(f).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"});}catch(e){return f;}}
function cop(n){if(!n&&n!==0)return"-";return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n);}

function capEstado(n,cron,av){
  if(!cron||!cron[n])return"pendiente";
  var fase=cron[n];
  var checks=fase.checks||{};
  var vals=Object.values(checks);
  var done=vals.filter(Boolean).length;
  if(vals.length===0)return"pendiente";
  if(done===vals.length)return"completo";
  if(done>0||fase.fIni)return"activo";
  return"pendiente";
}

// ===== BIENVENIDA PERSONALIZADA Y MENSAJES DINÁMICOS =====
// (secciones 1, 10 y 11 del documento). Todo configurable: editando estos
// arreglos cambias los mensajes sin tocar el resto del portal.

// Calcula en qué semana de obra estamos (desde la fecha de inicio)
function _semanaObra(fI){
  if(!fI)return 0;
  try{
    var ini=new Date(fI);ini.setHours(0,0,0,0);
    var hoy=new Date();hoy.setHours(0,0,0,0);
    var dias=Math.floor((hoy-ini)/(1000*60*60*24));
    if(dias<0)return 0;
    return Math.floor(dias/7)+1;
  }catch(e){return 0;}
}

// Primer nombre del cliente (para saludo cercano)
function _primerNombre(cli){
  if(!cli)return "";
  return String(cli).trim().split(/\s+/)[0];
}

// Mensaje de bienvenida que varía según avance y etapa
function _mensajeBienvenida(o){
  var av=+o.av||0;
  var etapa=String(o.etapa||"").toLowerCase();
  var mensajes;
  if(etapa==="entregado"||av>=100){
    mensajes=[
      "Tu espacio está listo ✨ Fue un gusto enorme construirlo contigo.",
      "Lo imaginaste, lo diseñamos y lo construimos juntos. ¡Disfrútalo! 🏡"
    ];
  }else if(av>=75){
    mensajes=[
      "Ya falta menos 🙌 Tu proyecto está entrando en la recta final.",
      "Estamos en los últimos detalles. Muy pronto disfrutarás tu nuevo espacio ✨"
    ];
  }else if(av>=40){
    mensajes=[
      "Tu obra va tomando forma 👀 Cada semana se ve más el resultado.",
      "Vamos a buen ritmo. Nos encargamos de los detalles para que tú disfrutes el proceso."
    ];
  }else if(av>=10){
    mensajes=[
      "Esta semana seguimos avanzando 💪 Queremos que estés al tanto de cada detalle.",
      "Tu proyecto ya arrancó y va con toda. Aquí te vamos contando cómo avanza."
    ];
  }else{
    mensajes=[
      "¡Arrancamos! 🚀 Qué emoción empezar a construir el espacio que imaginaste.",
      "Bienvenido a tu espacio MOSS 👋 Aquí vas a seguir tu obra paso a paso."
    ];
  }
  // Elegir uno de forma estable (según semana, para que no cambie en cada refresco)
  var idx=_semanaObra(o.fI)%mensajes.length;
  return mensajes[idx];
}

// Detecta si estamos en un momento especial de la obra
function _momentoEspecial(o,cron){
  var av=+o.av||0;
  var etapa=String(o.etapa||"").toLowerCase();
  // Entrega
  if(etapa==="entregado"||av>=100){
    return {titulo:"¡Llegó el gran día!",texto:"Lo imaginaste. Lo diseñamos. Lo construimos. Hoy empieza la parte más importante: disfrutarlo. 🥂"};
  }
  // Última semana (avance alto)
  if(av>=90){
    return {titulo:"Última etapa",texto:"Estamos en la recta final de tu proyecto. ¡Ya casi puedes disfrutar tu nuevo espacio! ✨"};
  }
  // Carpintería (cap 5 activo)
  if(cron&&cron[5]){
    var c5=cron[5];
    var c5activo=c5.fIni;
    if(!c5activo&&c5.checks){for(var k in c5.checks){if(c5.checks[k]){c5activo=true;break;}}}
    if(c5activo&&av<90){
      return {titulo:"Instalación de carpintería",texto:"Empieza a instalarse la carpintería 🪵 Uno de los momentos donde más se transforma tu espacio."};
    }
  }
  // Inicio reciente (primera semana)
  if(_semanaObra(o.fI)===1&&av<15){
    return {titulo:"Comienza tu proyecto",texto:"Hoy comienza una nueva etapa. Ahora sí empieza a tomar forma el espacio que imaginaste. 🚀"};
  }
  return null;
}

// Mensaje cálido de MOSS (rota según semana para no repetirse)
function _mensajeMoss(o){
  var mensajes=[
    "Gracias por confiar en MOSS para transformar tu espacio.",
    "Sabemos que remodelar es una decisión importante. Queremos que disfrutes el proceso tanto como el resultado.",
    "Cada avance que ves representa muchas horas de trabajo detrás. Estamos felices de construirlo contigo.",
    "Tu proyecto sigue avanzando. Nosotros nos encargamos de los detalles para que tú disfrutes el resultado.",
    "Estamos pendientes de cada detalle de tu obra, para que tú no tengas que preocuparte por nada."
  ];
  var idx=_semanaObra(o.fI)%mensajes.length;
  return mensajes[idx];
}

function render(data){
  var o=data.obra;
  var cron=data.cron;
  var videos=data.videos||[];
  var av=+o.av||0;
  var html="";

  // ===== BIENVENIDA PERSONALIZADA (sección 1) =====
  var nombre=_primerNombre(o.cli);
  var semana=_semanaObra(o.fI);
  html+='<div class="bienvenida">';
  html+='<div class="bienvenida-saludo">Hola, '+(nombre||"bienvenido")+' 👋</div>';
  html+='<div class="bienvenida-proyecto">'+o.nom+(semana>0?' · Semana '+semana:'')+' · '+formatEtapa(o.etapa)+'</div>';
  html+='<div class="bienvenida-mensaje">'+_mensajeBienvenida(o)+'</div>';
  html+='</div>';

  // ===== MOMENTO ESPECIAL (sección 11) — solo si aplica =====
  var momento=_momentoEspecial(o,cron);
  if(momento){
    html+='<div class="momento-especial">';
    html+='<div class="momento-especial-titulo">'+momento.titulo+'</div>';
    html+='<div class="momento-especial-texto">'+momento.texto+'</div>';
    html+='</div>';
  }

  // Tarjeta principal
  html+='<div class="card">';
  html+='<div class="card-header">';
  html+='<h2>'+o.nom+'</h2>';
  html+='<div class="sub">'+o.cli+' · '+o.cod+'</div>';
  html+='</div>';
  html+='<div class="card-body">';
  html+='<div style="margin-bottom:14px;"><span class="badge-etapa">'+formatEtapa(o.etapa)+'</span></div>';
  html+='<div class="kpi-grid">';
  html+='<div class="kpi"><div class="kpi-val">'+av+'%</div><div class="kpi-lbl">Avance general</div></div>';
  html+='<div class="kpi"><div class="kpi-val" style="color:var(--camel)">'+ff(o.fE)+'</div><div class="kpi-lbl" style="font-size:9px">Entrega estimada</div></div>';
  html+='</div>';
  html+='<div style="margin-top:12px;">';
  html+='<div style="font-size:11px;color:var(--g);margin-bottom:4px;">Progreso de obra</div>';
  html+='<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+av+'%"></div></div>';
  html+='<div style="font-size:10px;color:var(--g);text-align:right;">'+av+'% completado</div>';
  html+='</div>';
  if(o.fI){html+='<div style="font-size:11px;color:var(--g);margin-top:10px;">📅 Inicio: '+ff(o.fI)+'</div>';}
  html+='</div></div>';

  // Cronograma por capítulo
  html+='<div class="card">';
  html+='<div class="card-header"><h2>📋 Etapas de tu proyecto</h2></div>';
  html+='<div class="card-body">';
  CAPS.forEach(function(cap){
    var est=capEstado(cap.n,cron,av);
    var dotColor=est==="completo"?"var(--ok)":est==="activo"?"var(--warn)":"var(--b)";
    var badge=est==="completo"?'<span class="cap-estado estado-completo">✓ Completado</span>':
              est==="activo"?'<span class="cap-estado estado-activo">⚡ En progreso</span>':
              '<span class="cap-estado estado-pendiente">Pendiente</span>';
    html+='<div class="cap-row">';
    html+='<div class="cap-dot" style="background:'+dotColor+'"></div>';
    html+='<span class="cap-nom">'+cap.nom+'</span>';
    html+=badge;
    html+='</div>';
  });
  html+='</div></div>';

  // Nota semanal del equipo
  if(o.notaCliente){
    html+='<div class="card">';
    html+='<div class="card-header"><h2>💬 Mensaje de tu equipo MOSS</h2></div>';
    html+='<div class="card-body">';
    html+='<div class="nota-box">'+o.notaCliente.replace(/\n/g,"<br>")+'</div>';
    if(o.notaClienteTs){html+='<div class="nota-autor">Actualizado: '+new Date(o.notaClienteTs).toLocaleDateString("es-CO",{day:"numeric",month:"long"})+'</div>';}
    html+='</div></div>';
  }

  // Videos / fotos de avance
  if(videos.length>0){
    html+='<div class="card">';
    html+='<div class="card-header"><h2>📸 Registro de visitas y avance</h2><div class="sub">Videos y fotos semanales de tu proyecto</div></div>';
    html+='<div class="card-body">';
    videos.slice(0,8).forEach(function(v){
      html+='<a class="video-link" href="'+v.link+'" target="_blank" rel="noopener">';
      html+='<div class="video-icon">📹</div>';
      html+='<div class="video-info"><h4>'+v.semana+'</h4>';
      if(v.coment)html+='<p>'+v.coment.slice(0,100)+(v.coment.length>100?"...":"")+'</p>';
      else html+='<p style="color:var(--camel)">Ver video de avance →</p>';
      html+='</div></a>';
    });
    html+='</div></div>';
  }

  // Documentacion comercial del cliente (contrato, diseño, planos)
  if(data.docs&&data.docs.length>0){
    html+='<div class="card">';
    html+='<div class="card-header"><h2>📂 Tu documentación</h2><div class="sub">Contrato, diseños, planos y documentos aprobados</div></div>';
    html+='<div class="card-body">';
    data.docs.forEach(function(doc){
      var emoji=doc.ic.indexOf("COM")!==-1?"📋":doc.ic.indexOf("DIS")!==-1?"🎨":doc.ic.indexOf("DOC")!==-1?"📄":doc.ic.indexOf("FOT")!==-1?"📸":"📁";
      html+='<a class="video-link" href="'+doc.url+'" target="_blank" rel="noopener">';
      html+='<div class="video-icon" style="font-size:20px;background:var(--camel)">'+emoji+'</div>';
      html+='<div class="video-info">';
      html+='<h4>'+doc.nom+'</h4>';
      html+='<p>Toca para abrir en Google Drive →</p>';
      html+='</div></a>';
    });
    html+='</div></div>';
  }

  // Balance económico del cliente
  var bal=o.balanceCliente||{cuotas:[],adicionales:[]};
  var cuotas=bal.cuotas||[];
  var adicionales=bal.adicionales||[];
  if(cuotas.length>0||adicionales.length>0){
    var hoy=new Date();hoy.setHours(0,0,0,0);
    var totalContrato=+(o.pres||0);
    var totalAd=adicionales.reduce(function(s,a){return s+(+a.valor||0);},0);
    var totalObra=totalContrato+totalAd;
    var totalPagado=cuotas.filter(function(c){return c.pagado;}).reduce(function(s,c){return s+(+c.valor||0);},0)
      +adicionales.filter(function(a){return a.pagado;}).reduce(function(s,a){return s+(+a.valor||0);},0);
    var saldo=totalObra-totalPagado;
    var prox=cuotas.filter(function(c){return !c.pagado&&c.fechaVence;}).sort(function(a,b){return new Date(a.fechaVence)-new Date(b.fechaVence);})[0];

    html+='<div class="card">';
    html+='<div class="card-header"><h2>💳 Balance económico</h2><div class="sub">Estado de pagos de tu proyecto</div></div>';
    html+='<div class="card-body">';

    // KPIs
    html+='<div class="bal-kpi">';
    html+='<div class="bal-kpi-item"><div class="bal-kpi-val" style="color:var(--v)">'+cop(totalObra)+'</div><div class="bal-kpi-lbl">Valor total de obra</div></div>';
    html+='<div class="bal-kpi-item"><div class="bal-kpi-val" style="color:#3A6B45">'+cop(totalPagado)+'</div><div class="bal-kpi-lbl">Pagado</div></div>';
    html+='<div class="bal-kpi-item"><div class="bal-kpi-val" style="color:'+(saldo>0?"#B5362A":"#3A6B45")+'">'+cop(saldo)+'</div><div class="bal-kpi-lbl">Saldo pendiente</div></div>';
    html+='<div class="bal-kpi-item"><div class="bal-kpi-val" style="color:var(--camel)">'+cop(totalAd)+'</div><div class="bal-kpi-lbl">Adicionales</div></div>';
    html+='</div>';

    // Próximo pago
    if(prox){
      var fechaProx=new Date(prox.fechaVence);fechaProx.setHours(12);
      var diasProx=Math.round((fechaProx-hoy)/(1000*60*60*24));
      var alertColor=diasProx<=3?"#B5362A":diasProx<=7?"#C17B2A":"var(--v)";
      html+='<div style="background:#FFF6E5;border:1px solid #F0DDB4;border-radius:10px;padding:12px 14px;margin-bottom:12px;">';
      html+='<div style="font-size:11px;font-weight:700;color:#8A6A2E;margin-bottom:2px;">📅 PRÓXIMO PAGO</div>';
      html+='<div style="font-size:14px;font-weight:700;color:'+alertColor+'">'+prox.nom+'</div>';
      html+='<div style="font-size:13px;color:var(--v);font-weight:800;margin-top:2px;">'+cop(prox.valor)+'</div>';
      html+='<div style="font-size:11px;color:'+alertColor+';margin-top:3px;">'+(diasProx===0?"Vence hoy":diasProx<0?"Venció hace "+Math.abs(diasProx)+" días":"Vence en "+diasProx+" días")+" · "+new Date(prox.fechaVence).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})+'</div>';
      html+='</div>';
    }

    // Cuotas
    html+='<div style="font-weight:700;font-size:12px;margin-bottom:8px;color:var(--g);text-transform:uppercase;letter-spacing:.5px;">Cuotas del contrato</div>';
    cuotas.forEach(function(c){
      var vencida=c.fechaVence&&!c.pagado&&new Date(c.fechaVence)<hoy;
      var cls=c.pagado?"pagado":vencida?"vencida":"pendiente";
      var estadoTxt=c.pagado?"✓ Pagado":vencida?"⚠️ Vencido":"⏳ Pendiente";
      var estadoBg=c.pagado?"#DDEEE0;color:#2D6A3F":vencida?"#FDDEDE;color:#B5362A":"#FFF0CC;color:#8A6A2E";
      html+='<div class="bal-cuota '+cls+'">';
      html+='<div class="bal-row"><span class="bal-nom">'+c.nom+'</span><span class="bal-val" style="color:'+(c.pagado?"#3A6B45":vencida?"#B5362A":"var(--v)")+'">'+cop(c.valor)+'</span></div>';
      if(c.fechaVence&&!c.pagado)html+='<div style="font-size:11px;color:var(--g);margin-top:4px;">📅 Vence: '+new Date(c.fechaVence).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})+'</div>';
      if(c.pagado&&c.fechaPago)html+='<div style="font-size:11px;color:#3A6B45;margin-top:4px;">✓ Pagado el '+new Date(c.fechaPago).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})+'</div>';
      html+='<span class="bal-estado" style="background:'+estadoBg+'">'+estadoTxt+'</span>';
      html+='</div>';
    });

    // Adicionales
    if(adicionales.length>0){
      html+='<div style="font-weight:700;font-size:12px;margin:14px 0 8px;color:var(--g);text-transform:uppercase;letter-spacing:.5px;">Adicionales aprobados</div>';
      adicionales.forEach(function(a){
        html+='<div class="bal-add '+(a.pagado?"pagado":"")+'"><div class="bal-row">';
        html+='<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--camel)">'+a.nom+'</div>';
        if(a.fechaAprobacion)html+='<div style="font-size:11px;color:var(--g)">Aprobado: '+new Date(a.fechaAprobacion).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})+'</div>';
        if(a.nota)html+='<div style="font-size:11px;color:var(--g)">'+a.nota+'</div>';
        if(a.pagado&&a.fechaPago)html+='<div style="font-size:11px;color:#3A6B45">✓ Pagado el '+new Date(a.fechaPago).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})+'</div>';
        html+='</div>';
        html+='<div style="text-align:right;flex-shrink:0"><div style="font-size:14px;font-weight:800;color:var(--camel)">'+cop(a.valor)+'</div>';
        html+='<span class="bal-estado" style="background:'+(a.pagado?"#DDEEE0;color:#2D6A3F":"#FFF0CC;color:#8A6A2E")+'">'+(a.pagado?"✓ Pagado":"⏳ Pendiente")+'</span>';
        html+='</div></div></div>';
      });
    }
    html+='</div></div>';
  }

  // Canal de comunicacion con MOSS
  html+='<div class="card">';
  html+='<div class="card-header"><h2>💬 Comunicación con MOSS</h2><div class="sub">Deja solicitudes, cambios o anotaciones importantes de tu proyecto</div></div>';
  html+='<div class="card-body">';
  // Mostrar mensajes existentes
  var msgs=data.msgs||[];
  if(msgs.length===0){
    html+='<div class="msg-empty">Aún no hay mensajes. Usa este espacio para dejar anotaciones, solicitudes de cambio o consultas sobre tu proyecto.</div>';
  }else{
    html+='<div class="msg-wrap" id="msg-wrap">';
    msgs.forEach(function(m){
      var esMoss=m.tipo==="moss";
      html+='<div class="msg-burbuja '+(esMoss?"msg-moss":"msg-cliente")+'">';
      html+=m.texto.replace(/\n//g,"<br>");
      html+='<div class="msg-meta">'+(esMoss?"MOSS · ":"Tú · ")+new Date(m.ts).toLocaleDateString("es-CO",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+'</div>';
      html+='</div>';
    });
    html+='</div>';
  }
  // Input para nuevo mensaje
  html+='<textarea class="msg-input" id="msg-input" rows="3" placeholder="Ej: El cliente eligió el color de pintura: blanco hueso para sala y gris paloma para habitaciones. Confirmar con Sandra antes del martes."></textarea>';
  html+='<button class="msg-send-btn" id="msg-send-btn" onclick="enviarMensaje()">Enviar anotación</button>';
  html+='<div style="font-size:10px;color:var(--g);margin-top:6px;text-align:center;">Tu equipo MOSS verá este mensaje en el dashboard del proyecto</div>';
  html+='</div></div>';

  // ===== MENSAJE DE MOSS PARA TI (sección 10) =====
  html+='<div class="mensaje-moss">';
  html+='<div class="mensaje-moss-titulo">💌 Un mensaje de MOSS para ti</div>';
  html+='<div class="mensaje-moss-texto">'+_mensajeMoss(o)+'</div>';
  html+='</div>';

  // Contacto
  html+='<div class="card">';
  html+='<div class="card-header"><h2>📞 ¿Tienes alguna pregunta?</h2></div>';
  html+='<div class="card-body" style="font-size:13px;color:var(--g);line-height:1.7;">';
  html+='Tu equipo MOSS está disponible para resolver cualquier inquietud sobre tu proyecto.<br><br>';
  html+='<a href="mailto:care@mosscolombia.com.co" style="color:var(--v);font-weight:600;">✉️ care@mosscolombia.com.co</a><br>';
  html+='<a href="https://wa.me/57" style="color:var(--v);font-weight:600;">💬 Escríbenos por WhatsApp</a>';
  html+='</div></div>';

  html+='<div class="footer">Seguimiento de obra · <span>MOSS Remodelaciones</span><br>Esta información es confidencial y exclusiva para el titular del proyecto.</div>';

  document.getElementById("root").innerHTML=html;
}

function formatEtapa(e){
  var m={"diseno":"En diseño","preobra":"Pre-obra","ejecucion":"En ejecución","garantia":"Garantía","entregado":"✓ Entregado"};
  return m[String(e||"").toLowerCase()]||e||"En ejecución";
}

function mostrarError(msg,sub){
  document.getElementById("root").innerHTML='<div class="error-box"><div class="icon">🏗️</div><h2>'+msg+'</h2><p>'+(sub||"")+'</p></div>';
}

function enviarMensaje(){
  var input=document.getElementById("msg-input");
  var btn=document.getElementById("msg-send-btn");
  if(!input)return;
  var texto=input.value.trim();
  if(!texto){input.focus();return;}
  btn.disabled=true;btn.textContent="Enviando...";
  // Guardar via doPost con accion clienteMsg
  fetch(SCRIPT_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"cliente.mensaje",
      _clienteToken:getParam("token"),
      payload:{obraId:getParam("obra"),texto:texto,ts:Date.now()}
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d&&d.ok!==false){
      input.value="";
      btn.textContent="Enviar anotación";btn.disabled=false;
      // Recargar mensajes
      cargarDatos();
    }else{
      alert("No se pudo enviar el mensaje. Intenta de nuevo en unos segundos.");
      btn.textContent="Enviar anotación";btn.disabled=false;
    }
  })
  .catch(function(){
    alert("Sin conexión. Verifica tu internet e intenta de nuevo.");
    btn.textContent="Enviar anotación";btn.disabled=false;
  });
}

// Cargar datos
var obraId=getParam("obra");
var token=getParam("token");

// v2026.07.30 FIX: el fetch() normal es bloqueado por CORS en algunos
// navegadores porque Apps Script no devuelve Access-Control-Allow-Origin.
// Usamos JSONP (script tag dinamico) que no tiene restricciones CORS.
function cargarDatos(){
  if(!obraId||!token){
    mostrarError("Enlace incompleto","Por favor usa el enlace que te envió MOSS. Si tienes dudas escríbenos a care@mosscolombia.com.co");
    return;
  }
  // Limpiar callback anterior si existe
  if(window._mossJsonpCb)delete window._mossJsonpCb;
  var script=document.getElementById("_moss_jsonp");
  if(script)script.parentNode.removeChild(script);

  var timeout=setTimeout(function(){
    mostrarError("Sin conexión","No pudimos cargar tu proyecto en este momento. Intenta de nuevo en unos minutos.");
  },15000);

  window._mossJsonpCb=function(data){
    clearTimeout(timeout);
    try{
      var obras=data.obras||{};
      var o=obras[obraId];
      if(!o){mostrarError("Proyecto no encontrado","Verifica que el enlace sea correcto o contacta a MOSS.");return;}
      if(!o.clienteToken||o.clienteToken!==token){
        mostrarError("Acceso no autorizado","Este enlace no es válido. Contacta a tu equipo MOSS para obtener tu enlace personal.");
        return;
      }
      var vidsRaw=data.videos&&data.videos[obraId]?data.videos[obraId]:{};
      var videos=Object.values(vidsRaw).filter(function(v){return v&&v.link;}).sort(function(a,b){return (b.ts||0)-(a.ts||0);});
      videos=videos.map(function(v){
        var semana=v.ts?new Date(v.ts).toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"}):"";
        return{link:v.link,coment:v.coment||"",semana:semana};
      });
      var drives=(data.drives&&data.drives[obraId])||null;
      var docs=[];
      if(drives&&drives.carpetas){
        drives.carpetas.forEach(function(c){
          var ic=c.ic||"";
          if(ic.indexOf("COM")!==-1||ic.indexOf("DIS")!==-1||ic.indexOf("DOC")!==-1){
            docs.push(c);
          }
        });
      }
      var msgs=(o.clienteMsgs||[]).slice().sort(function(a,b){return a.ts-b.ts;});
      render({obra:o,cron:(data.cronograma&&data.cronograma[obraId])||{},videos:videos,docs:docs,msgs:msgs});
      setTimeout(function(){var w=document.getElementById("msg-wrap");if(w)w.scrollTop=w.scrollHeight;},100);
    }catch(e){
      mostrarError("Error cargando datos","Intenta recargar la página.");
    }
  };

  var s=document.createElement("script");
  s.id="_moss_jsonp";
  s.src=SCRIPT_URL+"?hoja=cron&callback=_mossJsonpCb";
  s.onerror=function(){clearTimeout(timeout);mostrarError("Sin conexión","No pudimos cargar tu proyecto. Intenta de nuevo en unos minutos.");};
  document.head.appendChild(s);
}
cargarDatos();
</script>
</body>
</html>
